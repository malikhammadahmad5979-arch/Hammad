<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yousaf Brothers - Boss Panel</title>
  <!-- DNS Prefetch & Preconnect for fast loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://firebaseapp.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <link rel="stylesheet" href="index.css">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3c72">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
      .sidebar { background: #1e3c72 !important; border-right: none; }
      .sidebar h2, .sidebar p, .nav-item { color: white !important; }
      .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1) !important; color: white !important; border-right-color: white !important; }
      .avatar { background: white !important; color: #1e3c72 !important; }
      .topbar { border-bottom: 2px solid #1e3c72; }
  </style>
</head>
<body>
  <div id="app" class="app-container">
    <!-- Sidebar -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <h2>Boss Panel</h2>
          <p>Yousaf Brothers Admin</p>
        </div>
        <button id="sidebar-close" class="sidebar-close-btn"><i class="ri-arrow-left-line"></i></button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer" style="margin-top: auto; padding: 20px; font-size: 11px; color: rgba(255,255,255,0.5); border-top: 1px solid rgba(255,255,255,0.1);">
        <p style="margin: 0;">System Developed By:</p>
        <p style="margin: 4px 0 0 0; font-weight: 700; color: white;">Jahanzeb Baloch</p>
        <p style="margin: 2px 0 0 0;">03060711529</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-toggle" class="icon-btn"><i class="ri-menu-line"></i></button>
          <h2 id="page-title">Admin Dashboard</h2>
        </div>
        <div class="topbar-right">
          <div class="user-profile">
            <div class="avatar">Admin</div>
            <span>Business Owner</span>
          </div>
        </div>
      </header>

      <!-- View Container -->
      <div id="view-container" class="view-container">
          <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
              <i class="ri-loader-4-line" style="font-size: 40px; color: #1e3c72; animation: spin 1s infinite linear;"></i>
          </div>
      </div>
    </main>
  </div>

  <!-- Note: JS files are shared from the parent folder -->
  <script src="js/store.js" type="module"></script>
  <script src="js/utils.js" type="module"></script>
  <script src="js/admin-app.js" type="module"></script>
</body>
</html>
